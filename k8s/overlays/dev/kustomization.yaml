apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Dev: 1 replica, relaxed resources
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: social-backend
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: social-backend-hpa

configMapGenerator:
  - name: social-backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - NODE_ENV=development
      - KAFKA_REPLICATION=1
