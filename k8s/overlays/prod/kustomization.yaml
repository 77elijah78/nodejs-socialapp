apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Prod: pin image tag, 3 replicas minimum
images:
  - name: your-registry/social-backend
    newTag: "1.0.0"   # ← CI sets this during deploy

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: social-backend

configMapGenerator:
  - name: social-backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - NODE_ENV=production
      - KAFKA_REPLICATION=3
      - KAFKA_PARTITIONS=6
