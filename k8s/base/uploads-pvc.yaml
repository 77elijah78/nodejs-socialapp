apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: social-backend
spec:
  accessModes:
    - ReadWriteMany   # Multiple pods can read/write (needs NFS or similar storage class)
  resources:
    requests:
      storage: 50Gi
  # Replace with your cluster's storage class that supports ReadWriteMany
  # e.g. on GKE: "standard-rwx", on EKS: "efs-sc", on AKS: "azurefile"
  storageClassName: standard-rwx
