# ⚠️  DO NOT commit real values — use Sealed Secrets, Vault, or ESO in production
# Run: kubectl create secret generic social-backend-secrets \
#        --from-literal=DATABASE_URL='postgresql://...' \
#        --from-literal=JWT_SECRET='...'               \
#        --from-literal=CORS_ORIGIN='https://yourapp.com' \
#        -n social-backend --dry-run=client -o yaml | kubeseal > sealed-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: social-backend-secrets
  namespace: social-backend
type: Opaque
stringData:
  DATABASE_URL: "postgresql://social:CHANGE_ME@postgres.social-backend.svc.cluster.local:5432/social_db"
  JWT_SECRET: "CHANGE_ME_32_CHARS_MINIMUM"
  CORS_ORIGIN: "https://yourdomain.com"
