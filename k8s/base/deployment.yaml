apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-backend
  namespace: social-backend
  labels:
    app: social-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: social-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # Zero-downtime deploys
  template:
    metadata:
      labels:
        app: social-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Spread pods across nodes for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: social-backend

      # Run DB migrations before new pods start
      initContainers:
        - name: migrate
          image: your-registry/social-backend:latest  # ← replace with your image
          command: ["node", "dist/scripts/migrate.js"]
          envFrom:
            - configMapRef:
                name: social-backend-config
            - secretRef:
                name: social-backend-secrets

      containers:
        - name: social-backend
          image: your-registry/social-backend:latest  # ← replace with your image
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          envFrom:
            - configMapRef:
                name: social-backend-config
            - secretRef:
                name: social-backend-secrets

          # Liveness: restart if server hangs
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          # Readiness: only route traffic when truly ready
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi

          # Give in-flight requests time to finish before shutdown
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]

      terminationGracePeriodSeconds: 30
